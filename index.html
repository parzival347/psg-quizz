    .small { font-size: var(--text-sm); }

    .section-title { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 920px) {

      .field-avatar { width: 58px; height: 58px; }
      .review-row { grid-template-columns: 56px 1fr; }
      .review-row > :last-child { grid-column: 1 / -1; }
    }
  </style>
</head>

                <stop offset="100%" stopColor="#7a0008" />

            </defs>
            <path d="M28,12 L5,34 L18,42 L18,96 L82,96 L82,42 L95,34 L72,12 L62,18 Q50,24 38,18 Z" fill="url(#jgrad)" stroke="rgba(0,0,0,0.3)" strokeWidth="1.5" />
            <text x="50" y="73" textAnchor="middle" fill="white" fontSize="30" fontFamily="Bebas Neue" letterSpacing="2">{number}</text>
          </svg>
          <p className="tiny faint" style={{ marginTop: '0.8rem', textTransform:'uppercase', letterSpacing:'.18em' }}>Photo indisponible</p>
        </div>
      );
    }



    function PlayerPhoto({ src, alt, className = '', style = {}, fallbackNumber = null }) {
      const [failed, setFailed] = useState(false);
      if (!src || failed) {
        return fallbackNumber !== null
          ? <div className={className} style={style}><JerseyFallback number={fallbackNumber} /></div>
          : <div className={className} style={style}></div>;
      }
      return <img src={src} alt={alt} loading="lazy" className={className} style={style} onError={() => setFailed(true)} />;
    }

    function LivesBar({ lives }) {
      return <div className="lives">{Array.from({ length: LIVES }).map((_, i) => <span key={i} style={{ filter: i < lives ? 'none' : 'grayscale(1) opacity(.25)' }}>❤️</span>)}</div>;
    }

    function OptionButton({ label, selected, answered, correct, onClick }) {
      let cls = 'btn-option';
      if (!answered && selected) cls += ' selected';
      if (answered && correct) cls += ' correct';
      if (answered && selected && !correct) cls += ' wrong';
      return <button className={cls} onClick={answered ? undefined : onClick}>{label}</button>;
    }

    function Field({ title, players }) {
      return (
        <div className="panel">
          <div className="panel-body">
            <div className="section-title">
              <div>
                <h2>{title}</h2>

              </div>
              <div className="pill">{players.filter(p => p.discovered).length} / {players.length} visibles</div>
            </div>
            <div className="field">
              <div className="half-line"></div>
              <div className="box-top"></div>
              <div className="box-bottom"></div>
              {players.map(player => (
                <div key={player.id} className="field-slot" style={{ left: `${player.slot.x}%`, top: `${player.slot.y}%` }}>
                  <div className="field-avatar">
                    {player.discovered ? <PlayerPhoto src={player.photo} alt={player.name} fallbackNumber={player.number} /> : <span>{player.number}</span>}
                  </div>
                  <div className="field-name">{player.discovered ? player.lastName || player.firstName : '???'}</div>
                  <div className="field-role">{player.shortPosition}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PSGQuizApp() {
      const [tab, setTab] = useState('quiz');
      const [matches, setMatches] = useState([]);
      const [matchesLoading, setMatchesLoading] = useState(true);
      const [quizLock, setQuizLock] = useState(false);
      const [players, setPlayers] = useState(() => shuffle(PLAYERS).map(p => ({ ...p, note:'', favorite:false })));
      const [idx, setIdx] = useState(0);
      const [phase, setPhase] = useState('welcome');
      const [lives, setLives] = useState(LIVES);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [maxStreak, setMaxStreak] = useState(0);
      const [correct, setCorrect] = useState(0);
      const [total, setTotal] = useState(0);
      const [selName, setSelName] = useState(null);
      const [selPos, setSelPos] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [isCorrect, setIsCorrect] = useState(null);
      const [reviewAnswers, setReviewAnswers] = useState({});
      const [reviewResult, setReviewResult] = useState(null);
      const [ultimatePool, setUltimatePool] = useState([]);
      const [ultimateIndex, setUltimateIndex] = useState(0);
      const [ultimateInput, setUltimateInput] = useState('');
      const [ultimateTime, setUltimateTime] = useState(10);
      const [ultimateRunning, setUltimateRunning] = useState(false);
      const [ultimateScore, setUltimateScore] = useState(0);
      const [ultimateBest, setUltimateBest] = useState(0);
      const [ultimateFeedback, setUltimateFeedback] = useState(null);
      const [ultimateChoices, setUltimateChoices] = useState([]);

      const current = players[idx];
      const starters = useMemo(() => players.filter(p => p.squad === 'starters'), [players]);
      const bench = useMemo(() => players.filter(p => p.squad === 'bench'), [players]);
      const discoveredPlayers = useMemo(() => players.filter(p => p.discovered), [players]);
      const favorites = useMemo(() => players.filter(p => p.favorite), [players]);
      const reviewPool = useMemo(() => makeReviewPool(players), [players]);
      const currentUltimate = ultimatePool[ultimateIndex] || null;
      const nameOptions = useMemo(() => current ? makeNameOpts(current) : [], [current, idx, players]);
      const posOptions = useMemo(() => current ? makePosOpts(current.position) : [], [current, idx, players]);

      const startGame = () => {
        setPlayers(prev => shuffle(prev));
        setIdx(0); setLives(LIVES); setScore(0); setStreak(0); setMaxStreak(0); setCorrect(0); setTotal(0);
        setSelName(null); setSelPos(null); setAnswered(false); setIsCorrect(null); setPhase('playing'); setTab('quiz');
      };

      const updatePlayer = (id, patch) => {
        setPlayers(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
      };

      const resetField = () => {
        setPlayers(prev => prev.map(p => ({ ...p, discovered:false })));
      };

      const confirm = () => {
        if (!current || !selName || !selPos || answered || quizLock) return;
        setQuizLock(true);
        const ok = selName === current.name && selPos === current.position;
        const nextStreak = ok ? streak + 1 : 0;
        const mult = Math.min(nextStreak, 5);
        const nextLives = ok ? lives : lives - 1;
        setAnswered(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setIsCorrect(ok);
        setStreak(nextStreak);
        setMaxStreak(ms => Math.max(ms, nextStreak));
        setScore(s => ok ? s + 100 * mult : s);
        setLives(nextLives);
        setCorrect(c => c + (ok ? 1 : 0));
        setTotal(t => t + 1);
        if (ok && !current.discovered) updatePlayer(current.id, { discovered: true });
        setTimeout(() => {
          setQuizLock(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          if (!ok && lives - 1 <= 0) { setPhase('gameover'); return; }
          if (idx + 1 >= players.length) { setPhase('complete'); return; }
          setIdx(i => i + 1);
          setSelName(null); setSelPos(null); setAnswered(false); setIsCorrect(null);
        }, 2000);
      };

      const next = () => {
        setQuizLock(false);
        if (lives <= 0) { setPhase('gameover'); return; }
        if (idx + 1 >= players.length) { setPhase('complete'); return; }
        setIdx(i => i + 1);
        setSelName(null); setSelPos(null); setAnswered(false); setIsCorrect(null);
      };

      const resetReview = () => { setReviewAnswers({}); setReviewResult(null); };
      const submitReview = () => {
        const details = reviewPool.map(p => {
          const user = normalize(reviewAnswers[p.id]);
          const expected = normalize(p.name);
          const ok = user && (user === expected || user === normalize(p.firstName + ' ' + p.lastName).trim() || user === normalize((p.lastName || p.firstName)));
          return { id: p.id, name: p.name, ok };
        });
        const good = details.filter(d => d.ok).length;
        setReviewResult({ good, total: details.length, details });
      };


      useEffect(() => {
        if (phase !== 'playing' || answered) return;
        if (selName && selPos) {
          const t = setTimeout(() => confirm(), 120);
          return () => clearTimeout(t);
        }
      }, [selName, selPos, phase, answered]);

      useEffect(() => {
        if (!ultimateRunning || !currentUltimate) return;
        const t = setInterval(() => {
          setUltimateTime(prev => {
            if (prev <= 1) {
              clearInterval(t);
              setTimeout(() => handleUltimateAnswer(true), 0);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(t);
      }, [ultimateRunning, ultimateIndex, currentUltimate]);

      const startUltimate = () => {
        const pool = shuffle(players.map(p => ({ ...p })));
        setUltimatePool(pool);
        setUltimateIndex(0);
        setUltimateInput('');
        setUltimateTime(10);
        setUltimateScore(0);
        setUltimateFeedback(null);
        setUltimateRunning(true);
        const first = pool[0];
        const wrong = shuffle(players.filter(p => p.id !== first.id)).slice(0, 3);
        setUltimateChoices(shuffle([first, ...wrong]));
      };

      const advanceUltimate = (nextScore) => {
        if (ultimateIndex + 1 >= ultimatePool.length) {
          setUltimateRunning(false);
          setUltimateBest(b => Math.max(b, nextScore));
          return;
        }
        const ni = ultimateIndex + 1;
        const nextPlayer = ultimatePool[ni];
        setUltimateIndex(ni);
        setUltimateInput('');
        setUltimateTime(10);
        if (nextPlayer) {
          const wrong = shuffle(players.filter(p => p.id !== nextPlayer.id)).slice(0, 3);
          setUltimateChoices(shuffle([nextPlayer, ...wrong]));
        }
      };

      const handleUltimateAnswer = (timeout = false, selectedName = null) => {
        if (!currentUltimate || !ultimateRunning) return;
        const ok = !timeout && selectedName === currentUltimate.name;
        const nextScore = ok ? ultimateScore + 1 : ultimateScore;
        updatePlayer(currentUltimate.id, { discovered: ok });
        setUltimateFeedback(ok ? `✅ ${currentUltimate.name} ajouté au terrain.` : `❌ ${currentUltimate.name} retiré du terrain.`);
        if (ok) setUltimateScore(s => s + 1);
        else setUltimateBest(b => Math.max(b, ultimateScore));
        setTimeout(() => advanceUltimate(nextScore), 700);
      };

      const stopUltimate = () => {
        setUltimateRunning(false);
        setUltimatePool([]);
        setUltimateIndex(0);
        setUltimateChoices([]);
        setUltimateTime(10);
        setUltimateFeedback('Partie arrêtée.');
        setUltimateBest(b => Math.max(b, ultimateScore));
      };

      const renderQuiz = () => {
        if (phase === 'welcome') {
          return (
            <div className="panel hero-card">
              <div className="panel-body" style={{ padding:'2rem' }}>
                <h1>Quiz PSG 2025 · 2026</h1>
                <div className="cards" style={{ marginTop:'1.5rem' }}>
                  <div className="player-card"><div className="player-content"><h3>18 joueurs</h3></div></div>
                  <div className="player-card"><div className="player-content"><h3>Deux terrains</h3></div></div>
                  <div className="player-card"><div className="player-content"><h3>Test ultime</h3></div></div>
                </div>
                <div className="actions" style={{ marginTop:'1.5rem' }}>
                  <button className="btn-primary" onClick={startGame}>Commencer</button>
                  <button className="btn-ghost" onClick={() => setTab('discover')}>Voir la découverte</button>
                </div>
              </div>
            </div>
          );
        }
        if (phase === 'gameover' || phase === 'complete') {
          const acc = total ? Math.round((correct / total) * 100) : 0;
          return (
            <div className="panel">
              <div className="panel-body">
                <h2>{phase === 'complete' ? 'Parcours terminé' : 'Game over'}</h2>
                <p className="muted" style={{ marginTop:'.8rem' }}>{phase === 'complete' ? 'Tu as parcouru toute la liste du quiz.' : 'Tu as perdu toutes tes vies pour cette session.'}</p>
                <div className="stats" style={{ marginTop:'1.2rem' }}>
                  <div className="stat-row"><span className="muted">Score</span><strong>{score} pts</strong></div>
                  <div className="stat-row"><span className="muted">Réponses justes</span><strong>{correct} / {total}</strong></div>
                  <div className="stat-row"><span className="muted">Précision</span><strong>{acc}%</strong></div>
                  <div className="stat-row"><span className="muted">Meilleure série</span><strong>{maxStreak}</strong></div>
                  <div className="stat-row"><span className="muted">Joueurs découverts</span><strong>{discoveredPlayers.length} / {players.length}</strong></div>
                </div>
                <div className="actions" style={{ marginTop:'1.2rem' }}>
                  <button className="btn-primary" onClick={startGame}>Rejouer</button>
                  <button className="btn-secondary" onClick={() => setTab('field')}>Voir les terrains</button>
                  <button className="btn-ghost" onClick={() => setTab('review')}>Aller en révision</button>
                </div>
              </div>
            </div>
          );
        }
        return (
          <div className="grid grid-main">
            <div className="panel hero-card">
              <div className="hero-media">
                {current?.photo ? <img src={current.photo} alt={current.name} /> : <JerseyFallback number={current?.number} />}
                {current && <div className="number-badge">#{current.number}</div>}
                {streak >= 2 && <div className="streak-badge">🔥 x{Math.min(streak, 5)}</div>}
              </div>
              <div className="panel-body">
                {answered && (
                  <div className={`feedback ${isCorrect ? 'ok' : 'bad'}`}>
                    {isCorrect ? `Bonne réponse. ${current.name} a été ajouté à tes joueurs découverts.` : `Mauvaise réponse. C’était ${current.name}, ${current.position.toLowerCase()}.`}
                  </div>
                )}
                <div className="question">
                  <div className="question-label">Qui est ce joueur ?</div>
                  <div className="options">
                    {nameOptions.map(name => (
                      <OptionButton key={name} label={name} selected={selName === name} answered={answered} correct={name === current.name} onClick={() => setSelName(name)} />
                    ))}
                  </div>
                </div>
                <div className="question">
                  <div className="question-label">Quel est son poste ?</div>
                  <div className="options">
                    {posOptions.map(pos => (
                      <OptionButton key={pos} label={pos} selected={selPos === pos} answered={answered} correct={pos === current.position} onClick={() => setSelPos(pos)} />
                    ))}
                  </div>
                </div>

              </div>
            </div>
            <div className="panel">
              <div className="panel-body">
                <h2>Session</h2>
                <div className="stats" style={{ marginTop:'1rem' }}>
                  <div className="stat-row"><span className="muted">Progression</span><strong>{Math.min(idx + (phase === 'playing' ? 1 : 0), players.length)} / {players.length}</strong></div>
                  <div className="stat-row"><span className="muted">Score</span><strong>{score}</strong></div>
                  <div className="stat-row"><span className="muted">Vies</span><LivesBar lives={lives} /></div>
                  <div className="stat-row"><span className="muted">Série</span><strong>{streak}</strong></div>
                  <div className="stat-row"><span className="muted">Découverts</span><strong>{discoveredPlayers.length}</strong></div>
                  <div className="stat-row"><span className="muted">Favoris</span><strong>{favorites.length}</strong></div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderDiscover = () => (
        <div className="split">
          <div className="panel">
            <div className="panel-body">
              <div className="section-title">
                <div>
                  <h2>Découverte</h2>
  
                </div>
                <div className="pill"><span className="discovered">●</span> {discoveredPlayers.length} découverts</div>
              </div>
              <div className="cards">
                {players.map(player => (
                  <div key={player.id} className="player-card">
                    <div className="player-thumb">
                      <PlayerPhoto src={player.photo} alt={player.name} fallbackNumber={player.number} style={{ width:'172px', height:'172px', borderRadius:'50%', overflow:'hidden', border:'4px solid rgba(255,255,255,.12)' }} />
                    </div>
                    <div className="player-content">
                      <div style={{ display:'flex', justifyContent:'space-between', gap:'.75rem', alignItems:'start' }}>
                        <div>
                          <h3>{player.name}</h3>
                          <p className="muted small">{player.age} ans · {player.position}</p>
                        </div>
                        <button className="btn-ghost tiny" onClick={() => updatePlayer(player.id, { favorite: !player.favorite })}>{player.favorite ? '★ Favori' : '☆ Favori'}</button>
                      </div>
                      <div style={{ display:'flex', gap:'.5rem', flexWrap:'wrap' }}>
                        <span className="pill">#{player.number}</span>
                        <span className="pill">{player.squad === 'starters' ? 'Titulaire' : 'Remplaçant'}</span>
                        <span className={`pill ${player.discovered ? 'discovered' : 'undiscovered'}`}>{player.discovered ? 'Découvert' : 'À trouver'}</span>
                      </div>
                      <p className="muted small">{player.bio}</p>
                      <label className="tiny faint">Ton commentaire</label>
                      <textarea value={player.note} onChange={e => updatePlayer(player.id, { note: e.target.value })} placeholder="Exemple : très bon dans le quiz, joueur que je veux retenir, poste à mémoriser..." />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="grid">
            <div className="panel">
              <div className="panel-body">
                <h2>Favoris</h2>
                {favorites.length ? (
                  <div className="review-list" style={{ marginTop:'1rem' }}>
                    {favorites.map(player => (
                      <div key={player.id} className="review-row">
                        <PlayerPhoto src={player.photo} alt={player.name} fallbackNumber={player.number} />
                        <div>
                          <strong className="fav">{player.name}</strong>
                          <div className="muted small">{player.position} · {player.age} ans</div>
                          <div className="tiny faint">{player.note || 'Aucun commentaire pour le moment.'}</div>
                        </div>
                        <button className="btn-ghost" onClick={() => updatePlayer(player.id, { favorite: false })}>Retirer</button>
                      </div>
                    ))}
                  </div>
                ) : <div className="empty" style={{ marginTop:'1rem' }}>Aucun favori pour l’instant.</div>}
              </div>
            </div>
            <div className="panel">
              <div className="panel-body">
                <h2>Mémorisation</h2>
                <p className="muted">Tu peux utiliser cette section comme carnet rapide : ajoute tes favoris, note ce qui te fait hésiter, puis va dans Révision pour tester uniquement les joueurs débloqués.</p>
              </div>
            </div>
          </div>
        </div>
      );

      const STATIC_MATCHES = [
        { title:'Paris FC vs PSG', date:'17 mai 2026', time:'19:00', score:null, competition:'Ligue 1', venue:'Stade Jean Bouin' },
        { title:'PSG vs Arsenal FC', date:'30 mai 2026', time:'16:00', score:null, competition:'Ligue des champions', venue:'Puskás Aréna' },
        { title:'PSG vs FC Lorient', date:'2 mai 2026', time:'15:00', score:'2-2', competition:'Ligue 1', venue:'Parc des Princes' },
        { title:'Bayern vs PSG', date:'6 mai 2026', time:'19:00', score:'1-1', competition:'Ligue des champions', venue:'Allianz Arena' },
        { title:'PSG vs Stade Brestois', date:'10 mai 2026', time:'19:00', score:'1-0', competition:'Ligue 1', venue:'Parc des Princes' },
        { title:'Lens vs PSG', date:'13 mai 2026', time:'19:00', score:'0-2', competition:'Ligue 1', venue:'Stade Bollaert-Delelis' },
      ];

      useEffect(() => {
        const load = async () => {
          setMatchesLoading(true);
          try {
            const resp = await fetch('matches.json?t=' + Date.now());
            if (!resp.ok) throw new Error('no matches.json');
            const data = await resp.json();
            setMatches(data.length ? data : STATIC_MATCHES);
          } catch {
            setMatches(STATIC_MATCHES);
          } finally {
            setMatchesLoading(false);
          }
        };
        load();
      }, []);

      const renderMatches = () => {
        const past = matches.filter(m => m.score);
        const upcoming = matches.filter(m => !m.score);
        return (
          <div className="split">
            <div className="panel">
              <div className="panel-body">
                <h2>Prochains matchs</h2>
                {matchesLoading && <p className="muted" style={{marginTop:'1rem'}}>Chargement...</p>}
                <div className="review-list" style={{marginTop:'1rem'}}>
                  {upcoming.map(m => (
                    <div key={m.date + m.title} className="review-row">
                      <div className="review-fallback"><strong>{m.time}</strong></div>
                      <div>
                        <strong>{m.title}</strong>
                        <div className="muted small">{m.date}</div>
                        <div className="tiny faint">{m.competition}{m.venue ? ' · ' + m.venue : ''}</div>
                      </div>
                    </div>
                  ))}
                  {!matchesLoading && upcoming.length === 0 && <p className="muted">Aucun match à venir.</p>}
                </div>
              </div>
            </div>
            <div className="panel">
              <div className="panel-body">
                <h2>Matchs passés</h2>
                <div className="review-list" style={{marginTop:'1rem'}}>
                  {past.map(m => (
                    <div key={m.date + m.title} className="review-row">
                      <div className="review-fallback"><strong>{m.score}</strong></div>
                      <div>
                        <strong>{m.title}</strong>
                        <div className="muted small">{m.date}</div>
                        <div className="tiny faint">{m.competition}{m.venue ? ' · ' + m.venue : ''}</div>
                      </div>
                    </div>
                  ))}
                  {!matchesLoading && past.length === 0 && <p className="muted">Aucun résultat récent.</p>}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderHonours = () => (
        <div className="split">
          <div className="panel">
            <div className="panel-body">
              <div className="section-title">
                <div>
                  <h2>Palmarès</h2>
                  <p className="muted small">Le PSG est fondé en 1970, gagne ses premiers grands titres dans les années 80 et 90, et devient un club global à partir de 2011.</p>
                </div>
              </div>
              <div className="review-list">
                {HONOURS.map(item => (
                  <div key={item.year + item.title} className="review-row">
                    <div className="review-fallback"><strong>{item.year}</strong></div>
                    <div>
                      <strong>{item.title}</strong>
                      <div className="muted small">{item.text}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="panel">
            <div className="panel-body">
              <h2>Matchs officiels</h2>
              <p className="muted" style={{marginBottom:'1rem'}}>Retrouve le calendrier complet et les résultats en direct sur le site officiel.</p>
              <a href="https://www.psg.fr/football-masculin/calendrier" target="_blank" rel="noreferrer" className="btn-secondary" style={{display:'inline-block',padding:'0.75rem 1.25rem',borderRadius:'0.9rem',color:'white',textDecoration:'none',fontWeight:'700',letterSpacing:'.08em',textTransform:'uppercase'}}>
                Calendrier officiel PSG
              </a>
            </div>
          </div>
        </div>
      );

      const renderField = () => (
        <div className="field-wrap">
          <div className="actions" style={{marginBottom:'1rem'}}><button className="btn-secondary" onClick={resetField}>Réinitialiser le terrain</button></div>
          <Field title="Terrain principal" players={starters} />
          <Field title="Banc et rotation" players={bench} />
        </div>
      );

      const renderReview = () => (
        <div className="split">
          <div className="panel">
            <div className="panel-body">
              <div className="section-title">
                <div>
                  <h2>Test ultime</h2>
  
                </div>
                <div className="actions">
                  <button className="btn-primary" onClick={startUltimate}>Lancer</button>
                  <button className="btn-ghost" onClick={stopUltimate}>Stop</button>
                </div>
              </div>
              {currentUltimate && ultimateRunning ? (
                <div className="grid" style={{ gap:'1rem' }}>
                  <div className="feedback ok" style={{ borderColor:'rgba(199,162,86,.45)', color:'white', background:'rgba(199,162,86,.08)' }}>
                    <div><strong>Temps restant :</strong> {ultimateTime}s</div>
                    <div><strong>Poste :</strong> {currentUltimate.position}</div>
                    <div style={{ marginTop:'.5rem' }}><strong>Description :</strong> {currentUltimate.bio}</div>
                  </div>
                  <div className="options">
                    {ultimateChoices.map(choice => (
                      <button key={choice.id} className="btn-option" onClick={() => handleUltimateAnswer(false, choice.name)}>{choice.name}</button>
                    ))}
                  </div>
                  {ultimateFeedback && <div className="tiny muted">{ultimateFeedback}</div>}
                </div>
              ) : (
                <div className="empty">Lance le test ultime pour commencer, ou relance une nouvelle série aléatoire.</div>
              )}
            </div>
          </div>
          <div className="grid">
            <div className="panel">
              <div className="panel-body">
                <h2>Performance</h2>
                <div className="stats" style={{ marginTop:'1rem' }}>
                  <div className="stat-row"><span className="muted">Score en cours</span><strong>{ultimateScore}</strong></div>
                  <div className="stat-row"><span className="muted">Meilleur enchaînement</span><strong>{ultimateBest}</strong></div>
                  <div className="stat-row"><span className="muted">Mode</span><strong>QCM aléatoire</strong></div>
                </div>
              </div>
            </div>
            <div className="panel">
              <div className="panel-body">
                <h2>Règle</h2>
                <p className="muted">Bonne réponse : le joueur est ajouté au terrain. Mauvaise réponse ou temps écoulé : il est retiré du terrain, même s’il y était déjà. Le bouton stop arrête immédiatement la série.</p>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="app">
          <div className="topbar">
            <div className="brand">
              <div className="brand-left">
                <div className="logo">⚽</div>
                <div>
                  <h1 style={{ fontSize:'2.2rem' }}>PSG Quiz Plus</h1>
                  <p className="muted small">Quiz, découverte, favoris, terrain et révision</p>
                </div>
              </div>
              <div className="pill">{discoveredPlayers.length} joueurs découverts</div>
            </div>
            <div className="tabs" role="tablist" aria-label="Navigation principale">
              {[
                ['quiz', 'Quiz'],
                ['discover', 'Découverte'],
                ['field', 'Terrain'],
                ['review', 'Test ultime'],
                ['honours', 'Palmarès'],
                ['matches', 'Matchs'],
              ].map(([id, label]) => (
                <button key={id} className={`tab ${tab === id ? 'active' : ''}`} onClick={() => setTab(id)}>{label}</button>
              ))}
            </div>
          </div>

          {tab === 'quiz' && renderQuiz()}
          {tab === 'discover' && renderDiscover()}
          {tab === 'field' && renderField()}
          {tab === 'review' && renderReview()}
          {tab === 'honours' && renderHonours()}
          {tab === 'matches' && renderMatches()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<PSGQuizApp />);
  </script>
</body>
</html>
